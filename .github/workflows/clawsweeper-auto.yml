name: ClawSweeper ready PR

# Additive native event transport. Keep existing comment and issue workflows.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string
      publish:
        description: "Publish review results"
        required: false
        type: boolean
        default: true
permissions:
  contents: read
  pull-requests: read
jobs:
  relay:
    if: vars.CLAWSWEEPER_SPARK_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bind the native event to the current PR
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PYBIND'
          import json, os, re, subprocess
          def get(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          def skip():
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('requested=false\n')
              raise SystemExit(0)
          event_name = os.environ.get('GITHUB_EVENT_NAME')
          if event_name not in ('pull_request_target', 'workflow_dispatch'): skip()
          with open(os.environ['GITHUB_EVENT_PATH']) as event_file:
              event = json.load(event_file)
          if event_name == 'pull_request_target' and event.get('action') == 'edited' and 'base' not in event.get('changes', {}): skip()
          target = os.environ['TARGET_REPO']
          repo = get('repos/' + target)
          if str(repo['id']) != os.environ['TARGET_ID']: raise SystemExit('Repository identity changed')
          if repo.get('archived') or repo.get('disabled'): skip()
          number = os.environ.get('PR_NUMBER', '')
          if not re.fullmatch(r'[1-9][0-9]*', number): raise SystemExit('Invalid PR number')
          pull = get(f'repos/{target}/pulls/{number}')
          if pull['state'] != 'open' or pull['draft']: skip()
          if pull['head']['repo']['id'] != repo['id']: skip()
          if pull['base']['repo']['id'] != repo['id'] or pull['base']['ref'] != repo['default_branch']: skip()
          base = pull['base']['sha']
          head = pull['head']['sha']
          if any(not re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)): raise SystemExit('Invalid source tuple')
          pub = 'true'
          if event_name == 'workflow_dispatch' and os.environ.get('PUBLISH', '').lower() == 'false':
              pub = 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'requested=true\npr_number={number}\nbase_sha={base}\nhead_sha={head}\npublish={pub}\n')
          PYBIND
      - name: Bind request to this source workflow
        if: steps.live.outputs.requested == 'true'
        env:
          TARGET_REPO: ${{ github.repository }}
          TARGET_ID: ${{ github.repository_id }}
          PR: ${{ steps.live.outputs.pr_number }}
          BASE: ${{ steps.live.outputs.base_sha }}
          HEAD: ${{ steps.live.outputs.head_sha }}
          PUBLISH: ${{ steps.live.outputs.publish }}
        run: |
          python3 -I - <<'PYREQUEST' > "$RUNNER_TEMP/clawsweeper-request.json"
          import json, os
          payload = dict(target_repo=os.environ['TARGET_REPO'], repository_id=os.environ['TARGET_ID'],
                         pr=os.environ['PR'], requested_base=os.environ['BASE'], requested_head=os.environ['HEAD'],
                         origin_repository=os.environ['GITHUB_REPOSITORY'], origin_run_id=os.environ['GITHUB_RUN_ID'],
                         origin_run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], comment_id='',
                         publish=(os.environ.get('PUBLISH', 'true') == 'true'))
          print(json.dumps(dict(event_type='clawsweeper_native_pr', client_payload=payload)))
          PYREQUEST
      - name: Store immutable request evidence
        if: steps.live.outputs.requested == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clawsweeper-request-${{ github.run_attempt }}
          path: ${{ runner.temp }}/clawsweeper-request.json
          if-no-files-found: error
          retention-days: 7
      - name: Dispatch to private review host
        if: steps.live.outputs.requested == 'true'
        env:
          GH_TOKEN: ${{ secrets.CLAWSWEEPER_DISPATCH_TOKEN }}
          CLAWSWEEPER_DO_QUEUE_MODE: ${{ vars.CLAWSWEEPER_DO_QUEUE_MODE }}
          CLAWSWEEPER_DO_QUEUE_SECRET: ${{ secrets.CLAWSWEEPER_DO_QUEUE_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo 'ClawSweeper dispatch credential is not configured.' >&2; exit 1; }
          queue_status=0
          python3 -I - <<'PYQUEUE' || queue_status=$?
          import hashlib, hmac, json, os, sys, urllib.error, urllib.request
          mode = os.environ.get('CLAWSWEEPER_DO_QUEUE_MODE', 'off').strip().lower()
          if mode not in ('shadow', 'primary'):
              print(f'ClawSweeper queue dual-write disabled (mode={mode or "off"}).')
              raise SystemExit(0)
          secret = os.environ.get('CLAWSWEEPER_DO_QUEUE_SECRET', '')
          if not secret:
              message = 'ClawSweeper queue secret is not configured.'
              if mode == 'primary':
                  print(message, file=sys.stderr); raise SystemExit(1)
              print(f'::warning::{message} Continuing with Actions in shadow mode.')
              raise SystemExit(0)
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'clawsweeper-request.json')) as handle:
              client_payload = json.load(handle)['client_payload']
          admit = {
              'requestId': f"native:{client_payload['origin_run_id']}:{client_payload['origin_run_attempt']}",
              'repository': client_payload['target_repo'],
              'pr': int(client_payload['pr']),
              'base': client_payload['requested_base'],
              'head': client_payload['requested_head'],
              'commentId': client_payload['comment_id'],
              'kind': 'command' if client_payload['comment_id'] else 'automatic',
              'clientPayload': client_payload,
          }
          raw = json.dumps(admit, separators=(',', ':')).encode()
          signature = 'sha256=' + hmac.new(secret.encode(), raw, hashlib.sha256).hexdigest()
          request = urllib.request.Request(
              'https://queue.ztoned.com/internal/intake/admit', data=raw, method='POST',
              headers={'content-type': 'application/json', 'user-agent': 'clawsweeper-queue-client/1.0', 'x-clawsweeper-exact-review-signature': signature})
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  result = json.load(response)
              if result.get('accepted') is not True:
                  raise ValueError(f"queue rejected admit: {result.get('reason', 'unknown')}")
              print(f"ClawSweeper queue {mode} admit accepted (deduped={result.get('deduped') is True}).")
              raise SystemExit(86 if mode == 'primary' else 0)
          except Exception as error:
              if mode == 'primary':
                  print(f'ClawSweeper queue primary admit failed: {error}', file=sys.stderr)
                  raise SystemExit(1)
              print(f'::warning::ClawSweeper queue shadow admit failed; continuing with Actions: {error}')
              raise SystemExit(0)
          PYQUEUE
          if [ "$queue_status" -eq 86 ]; then
            echo 'Queue is primary for this repository; skipping Actions repository_dispatch.'
            exit 0
          fi
          [ "$queue_status" -eq 0 ] || exit "$queue_status"
          gh api --method POST repos/saari-co/spark-dgx/dispatches --input "$RUNNER_TEMP/clawsweeper-request.json"
